# Render Blueprint for the public demo (free plan).
services:
  - type: web
    name: prapti
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 30 --bind 0.0.0.0:$PORT
    healthCheckPath: /about
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PRAPTI_SANDBOX      # editor changes stay with each visitor
        value: "1"
      - key: PRAPTI_AI           # offline reader until we turn AI on
        value: "off"
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY          # Render makes a random value; nobody has to type it
        generateValue: true
